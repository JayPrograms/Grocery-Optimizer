[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-savings"
version = "0.1.0"
description = "Grocery Savings Optimizer MVP services"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12,<1",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
ranking-api = "apps.ranking.api:run"
ranking-projector = "apps.ranking.consumer:run"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
