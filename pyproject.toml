[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-savings-event-contracts"
version = "0.1.0"
description = "Shared Pydantic event contracts for the grocery savings optimizer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
infrastructure = [
    "aiokafka>=0.12,<1",
    "confluent-kafka>=2.8,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1.1,<2",
]

[project.scripts]
ranking-api = "apps.ranking.main:run"
ranking-projector = "apps.ranking.consumer:run"

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
markers = [
    "smoke: requires the local Docker Compose infrastructure",
]
pythonpath = ["packages"]
testpaths = ["tests"]
