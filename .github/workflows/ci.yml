name: CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[infrastructure,dev]'
      - run: python -m pytest -o addopts='-p no:cacheprovider' -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  acceptance:
    name: Compose integration and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_INFRA_SMOKE: '1'
      RUN_ACCEPTANCE: '1'
      TEST_RANKING_DATABASE_URL: postgresql://grocery_app:replace_me_for_local_development@127.0.0.1:55432/grocery_savings
      TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[infrastructure,dev]'
      - name: Configure local fixture environment
        run: cp .env.example .env
      - name: Build and start complete stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Run every backend, integration, and acceptance test
        run: python -m pytest -o addopts='-p no:cacheprovider' -q
      - name: Show stack diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 150
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down --volumes
